<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="HSPA Monitor — veřejný portál o českém zdravotnictví">
  <defs>
    <style>
      .root { font-family: 'Source Serif 4', 'Source Serif Pro', Georgia, 'Times New Roman', serif; }
      .kicker { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; }
      .sans { font-family: 'Inter', system-ui, sans-serif; }
      .serif { font-family: 'Source Serif 4', Georgia, serif; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#fbf8f1"/>

  <!-- Top rule -->
  <rect x="64" y="56" width="1072" height="2" fill="#1f1a14"/>

  <!-- Top masthead row -->
  <g>
    <text class="kicker" x="64" y="42" font-size="14" fill="#5f574e">HSPA · OECD METODIKA · VEŘEJNÝ PORTÁL</text>
    <text class="kicker" x="1136" y="42" text-anchor="end" font-size="14" fill="#5f574e">2026 · ČESKÁ REPUBLIKA</text>
  </g>

  <!-- Brand: HSPA monitor -->
  <g transform="translate(64, 130)">
    <text class="serif" font-size="92" font-weight="700" fill="#1f1a14" letter-spacing="-2">HSPA <tspan font-style="italic" font-weight="400" fill="#b8361e">monitor</tspan></text>
    <text class="sans" x="0" y="34" font-size="14" fill="#8b8278" letter-spacing="0.08em">skorezdravotnictvi.cz</text>
  </g>

  <!-- Tagline -->
  <g transform="translate(64, 230)">
    <text class="serif" font-size="38" font-weight="700" fill="#1f1a14" letter-spacing="-0.5">Veřejný portál o českém</text>
    <text class="serif" x="0" y="48" font-size="38" font-weight="700" fill="#1f1a14" letter-spacing="-0.5">zdravotnictví. Z dat, ne z dojmů.</text>
  </g>

  <!-- Lead -->
  <g transform="translate(64, 360)">
    <text class="serif" font-size="19" fill="#5f574e">Naděje dožití, čekací doby, výdaje, prevence, reformní debata —</text>
    <text class="serif" x="0" y="28" font-size="19" fill="#5f574e">primární data ÚZIS, ČSÚ, OECD a Eurostat propojená s editoriálem</text>
    <text class="serif" x="0" y="56" font-size="19" fill="#5f574e">a redakčními analýzami.</text>
  </g>

  <!-- Right column: counters grid 2×2 -->
  <g transform="translate(720, 130)">
    <!-- Counter 1 -->
    <g>
      <rect x="0" y="0" width="200" height="100" fill="#f3eee2" stroke="rgba(31,26,20,0.13)" stroke-width="1"/>
      <text class="sans" x="16" y="32" font-size="48" font-weight="700" fill="#1f1a14">80</text>
      <text class="sans" x="16" y="56" font-size="11" font-weight="700" letter-spacing="0.08em" fill="#5f574e">INDIKÁTORŮ</text>
      <text class="serif" x="16" y="82" font-size="13" fill="#5f574e">HSPA + monitoring</text>
    </g>
    <!-- Counter 2 -->
    <g transform="translate(216, 0)">
      <rect x="0" y="0" width="200" height="100" fill="#f3eee2" stroke="rgba(31,26,20,0.13)" stroke-width="1"/>
      <text class="sans" x="16" y="32" font-size="48" font-weight="700" fill="#1f1a14">75<tspan font-size="32">+</tspan></text>
      <text class="sans" x="16" y="56" font-size="11" font-weight="700" letter-spacing="0.08em" fill="#5f574e">ČLÁNKŮ</text>
      <text class="serif" x="16" y="82" font-size="13" fill="#5f574e">long-form journalism</text>
    </g>
    <!-- Counter 3 -->
    <g transform="translate(0, 116)">
      <rect x="0" y="0" width="200" height="100" fill="#f3eee2" stroke="rgba(31,26,20,0.13)" stroke-width="1"/>
      <text class="sans" x="16" y="32" font-size="48" font-weight="700" fill="#1f1a14">14</text>
      <text class="sans" x="16" y="56" font-size="11" font-weight="700" letter-spacing="0.08em" fill="#5f574e">KRAJŮ</text>
      <text class="serif" x="16" y="82" font-size="13" fill="#5f574e">interaktivní dashboard</text>
    </g>
    <!-- Counter 4 -->
    <g transform="translate(216, 116)">
      <rect x="0" y="0" width="200" height="100" fill="#f3eee2" stroke="rgba(31,26,20,0.13)" stroke-width="1"/>
      <text class="sans" x="16" y="32" font-size="48" font-weight="700" fill="#1f1a14">34</text>
      <text class="sans" x="16" y="56" font-size="11" font-weight="700" letter-spacing="0.08em" fill="#5f574e">STRATEGIÍ</text>
      <text class="serif" x="16" y="82" font-size="13" fill="#5f574e">ČR, EU, OECD, WHO</text>
    </g>

    <!-- Note pod countery -->
    <g transform="translate(0, 240)">
      <text class="sans" x="0" y="0" font-size="11" font-weight="700" letter-spacing="0.08em" fill="#b8361e">METODIKA</text>
      <text class="serif" x="0" y="22" font-size="13" fill="#5f574e">OECD HSPA Framework (2023)</text>
      <text class="serif" x="0" y="40" font-size="13" fill="#5f574e">Health at a Glance 2025</text>
    </g>
  </g>

  <!-- Accent bar pravá -->
  <rect x="1132" y="130" width="4" height="430" fill="#b8361e"/>

  <!-- Bottom row -->
  <rect x="64" y="558" width="1072" height="1" fill="rgba(31,26,20,0.13)"/>

  <g transform="translate(64, 590)">
    <!-- Disclaimer ai -->
    <text class="sans" font-size="13" fill="#5f574e">
      <tspan font-weight="700" fill="#1f1a14">Experiment.</tspan>
      <tspan dx="4">Píše Claude z dat, lidská kontrola namátkou. Chyby jsou možné — pod každým tvrzením je odkaz na primární zdroj.</tspan>
    </text>
  </g>

  <!-- URL bottom right -->
  <g transform="translate(1136, 590)">
    <text class="sans" text-anchor="end" font-size="14" font-weight="700" letter-spacing="0.04em" fill="#1f1a14">hspa-cesko.cz →</text>
  </g>
</svg>