<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Spotřeba antibiotik ve veterinární medicíně v Česku">
  <defs>
    <style>
      .kicker { font-family: 'Inter', system-ui, sans-serif; font-weight: 700; letter-spacing: 2px; }
      .headline { font-family: 'Source Serif 4', Georgia, serif; font-weight: 700; }
      .brand { font-family: 'Inter', system-ui, sans-serif; font-weight: 600; }
      .num { font-family: 'Source Serif 4', Georgia, serif; font-weight: 700; }
      .lbl { font-family: 'Inter', system-ui, sans-serif; font-weight: 500; }
    </style>
  </defs>
  <rect width="1200" height="630" fill="#fbf8f1"/>
  <rect x="1176" y="0" width="24" height="630" fill="#2e7d5b"/>
  <text x="72" y="92" class="kicker" font-size="22" fill="#2e7d5b">ANTIBIOTICKÁ REZISTENCE · ONE HEALTH</text>
  <line x1="72" y1="112" x2="760" y2="112" stroke="#2e7d5b" stroke-width="3"/>
  <text class="headline" font-size="56" fill="#1b1b1b">
    <tspan x="72" y="202">Antibiotika ve zvířatech:</tspan>
    <tspan x="72" y="266">Česko je evropský premiant.</tspan>
    <tspan x="72" y="330">Proč na tom záleží i pro lidi.</tspan>
  </text>
  <!-- viz panel -->
  <g transform="translate(72,400)">
    <text x="0" y="0" class="lbl" font-size="20" fill="#6b6b6b">Spotřeba veterinárních antibiotik (mg/PCU) — Česko vs. průměr EU</text>
    <!-- CZ bar -->
    <rect x="0" y="22" width="360" height="34" fill="#2e7d5b"/>
    <text x="372" y="46" class="num" font-size="24" fill="#2e7d5b">56,3 · Česko 2023</text>
    <!-- EU bar -->
    <rect x="0" y="70" width="566" height="34" fill="#c0392b"/>
    <text x="578" y="94" class="num" font-size="24" fill="#c0392b">88,5 · průměr EU</text>
  </g>
  <text x="72" y="560" class="num" font-size="22" fill="#1b1b1b">56,3 mg/PCU · o ~třetinu pod EU · už pod cílem 2030 (59,2)</text>
  <line x1="72" y1="588" x2="1128" y2="588" stroke="#d9d2c4" stroke-width="2"/>
  <text x="72" y="616" class="brand" font-size="18" fill="#6b6b6b">HSPA Monitor · skorezdravotnictvi.cz</text>
  <text x="1128" y="616" text-anchor="end" class="brand" font-size="18" fill="#6b6b6b">5. června 2026</text>
</svg>
