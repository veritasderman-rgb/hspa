<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Léčitelná mortalita v Česku v evropském srovnání">
  <defs>
    <style>
      .kicker { font-family: 'Inter', system-ui, sans-serif; font-weight: 700; letter-spacing: 2px; }
      .headline { font-family: 'Source Serif 4', Georgia, serif; font-weight: 700; }
      .brand { font-family: 'Inter', system-ui, sans-serif; font-weight: 600; }
      .num { font-family: 'Source Serif 4', Georgia, serif; font-weight: 700; }
      .lbl { font-family: 'Inter', system-ui, sans-serif; font-weight: 500; }
    </style>
  </defs>
  <rect width="1200" height="630" fill="#fbf8f1"/>
  <rect x="1176" y="0" width="24" height="630" fill="#c0392b"/>
  <text x="72" y="92" class="kicker" font-size="22" fill="#c0392b">KVALITA PÉČE · VÝSLEDKY</text>
  <line x1="72" y1="112" x2="760" y2="112" stroke="#c0392b" stroke-width="3"/>
  <text class="headline" font-size="52" fill="#1b1b1b">
    <tspan x="72" y="196">Co dokáže systém vyléčit:</tspan>
    <tspan x="72" y="256">Česko ztrácí o čtvrtinu víc</tspan>
    <tspan x="72" y="316">životů, kterým šlo zabránit léčbou.</tspan>
  </text>
  <!-- viz panel -->
  <g transform="translate(72,398)">
    <text x="0" y="0" class="lbl" font-size="20" fill="#6b6b6b">Léčitelná mortalita (na 100 000 obyvatel do 75 let, 2023)</text>
    <!-- EU bar -->
    <rect x="0" y="22" width="347" height="34" fill="#2e7d5b"/>
    <text x="359" y="46" class="num" font-size="24" fill="#2e7d5b">86,8 · průměr EU27</text>
    <!-- CZ bar -->
    <rect x="0" y="70" width="429" height="34" fill="#c0392b"/>
    <text x="441" y="94" class="num" font-size="24" fill="#c0392b">107,2 · Česko</text>
  </g>
  <text x="72" y="560" class="num" font-size="22" fill="#1b1b1b">ČR o ~24 % nad EU · od 2011 pokles o 27 % · Rakousko 68,5 · Slovensko 161,1</text>
  <line x1="72" y1="588" x2="1128" y2="588" stroke="#d9d2c4" stroke-width="2"/>
  <text x="72" y="616" class="brand" font-size="18" fill="#6b6b6b">HSPA Monitor · skorezdravotnictvi.cz</text>
  <text x="1128" y="616" text-anchor="end" class="brand" font-size="18" fill="#6b6b6b">7. června 2026</text>
</svg>
