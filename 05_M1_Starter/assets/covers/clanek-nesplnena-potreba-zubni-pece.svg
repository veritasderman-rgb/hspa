<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Nesplněná potřeba zubní péče v Česku podle příjmu">
  <defs>
    <style>
      .kicker { font-family: 'Inter', system-ui, sans-serif; font-weight: 700; letter-spacing: 2px; }
      .headline { font-family: 'Source Serif 4', Georgia, serif; font-weight: 700; }
      .brand { font-family: 'Inter', system-ui, sans-serif; font-weight: 600; }
      .num { font-family: 'Source Serif 4', Georgia, serif; font-weight: 700; }
      .lbl { font-family: 'Inter', system-ui, sans-serif; font-weight: 500; }
    </style>
  </defs>
  <rect width="1200" height="630" fill="#fbf8f1"/>
  <rect x="1176" y="0" width="24" height="630" fill="#2e6f9e"/>
  <text x="72" y="92" class="kicker" font-size="22" fill="#2e6f9e">DOSTUPNOST PÉČE · SPRAVEDLNOST</text>
  <line x1="72" y1="112" x2="760" y2="112" stroke="#2e6f9e" stroke-width="3"/>
  <text class="headline" font-size="54" fill="#1b1b1b">
    <tspan x="72" y="198">Zuby na příjem: chudí odkládají</tspan>
    <tspan x="72" y="260">zubaře pětkrát častěji</tspan>
    <tspan x="72" y="322">než bohatí.</tspan>
  </text>
  <!-- viz panel -->
  <g transform="translate(72,398)">
    <text x="0" y="0" class="lbl" font-size="20" fill="#6b6b6b">Nesplněná potřeba zubní péče v ČR podle příjmu (% populace 16+, 2024)</text>
    <!-- QU5 bar (nejvyšší příjmy) -->
    <rect x="0" y="22" width="100" height="34" fill="#2e7d5b"/>
    <text x="112" y="46" class="num" font-size="24" fill="#2e7d5b">0,5 · nejvyšší příjmy (QU5)</text>
    <!-- QU1 bar (nejnižší příjmy) -->
    <rect x="0" y="70" width="500" height="34" fill="#c0392b"/>
    <text x="512" y="94" class="num" font-size="24" fill="#c0392b">2,5 · nejnižší příjmy (QU1)</text>
  </g>
  <text x="72" y="560" class="num" font-size="22" fill="#1b1b1b">ČR celkem 1,3 % · průměr EU27 3,3 % · po pandemii zhruba 2× nárůst</text>
  <line x1="72" y1="588" x2="1128" y2="588" stroke="#d9d2c4" stroke-width="2"/>
  <text x="72" y="616" class="brand" font-size="18" fill="#6b6b6b">HSPA Monitor · skorezdravotnictvi.cz</text>
  <text x="1128" y="616" text-anchor="end" class="brand" font-size="18" fill="#6b6b6b">6. června 2026</text>
</svg>
