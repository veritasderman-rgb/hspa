<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Centra duševního zdraví v Česku">
  <defs>
    <style>
      .kicker { font-family: 'Inter', system-ui, sans-serif; font-weight: 700; letter-spacing: 2px; }
      .headline { font-family: 'Source Serif 4', Georgia, serif; font-weight: 700; }
      .brand { font-family: 'Inter', system-ui, sans-serif; font-weight: 600; }
      .num { font-family: 'Source Serif 4', Georgia, serif; font-weight: 700; }
      .lbl { font-family: 'Inter', system-ui, sans-serif; font-weight: 500; }
    </style>
  </defs>
  <rect width="1200" height="630" fill="#fbf8f1"/>
  <rect x="1176" y="0" width="24" height="630" fill="#c0392b"/>
  <text x="72" y="92" class="kicker" font-size="22" fill="#c0392b">DUŠEVNÍ ZDRAVÍ · DOSTUPNOST PÉČE</text>
  <line x1="72" y1="112" x2="700" y2="112" stroke="#c0392b" stroke-width="3"/>
  <text class="headline" font-size="58" fill="#1b1b1b">
    <tspan x="72" y="206">Reforma slíbila 100 center</tspan>
    <tspan x="72" y="272">duševního zdraví. Funguje</tspan>
    <tspan x="72" y="338">jich zhruba 40.</tspan>
  </text>
  <!-- viz panel -->
  <g transform="translate(72,400)">
    <text x="0" y="0" class="lbl" font-size="20" fill="#6b6b6b">Centra na 100 tisíc obyvatel — Česko vs. cíl</text>
    <!-- CZ bar -->
    <rect x="0" y="22" width="252" height="34" fill="#c0392b"/>
    <text x="0" y="14" class="lbl" font-size="15" fill="#1b1b1b" transform="translate(0,6)"></text>
    <text x="264" y="46" class="num" font-size="24" fill="#c0392b">0,37 · Česko 2024</text>
    <!-- target bar -->
    <rect x="0" y="70" width="680" height="34" fill="#2e7d5b"/>
    <text x="694" y="94" class="num" font-size="24" fill="#2e7d5b">1,0 · cíl NAPDZ 2030</text>
  </g>
  <text x="72" y="560" class="num" font-size="22" fill="#1b1b1b">40 center · 0,37 / 100 tis. · cíl 100 center do 2030</text>
  <line x1="72" y1="588" x2="1128" y2="588" stroke="#d9d2c4" stroke-width="2"/>
  <text x="72" y="616" class="brand" font-size="18" fill="#6b6b6b">HSPA Monitor · skorezdravotnictvi.cz</text>
  <text x="1128" y="616" text-anchor="end" class="brand" font-size="18" fill="#6b6b6b">4. června 2026</text>
</svg>
