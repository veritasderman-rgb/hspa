<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="HSPA Monitor — hodnocení výkonnosti zdravotního systému ČR">
  <defs>
    <style>
      .brand { font-family: 'Source Serif 4', Georgia, 'Times New Roman', serif; font-weight: 700; fill: #1f1a14; }
      .brand em { font-style: italic; font-weight: 400; }
      .tag { font-family: 'Inter', system-ui, sans-serif; font-size: 22px; fill: #5f574e; letter-spacing: 0.01em; }
      .kick { font-family: 'Inter', system-ui, sans-serif; font-size: 17px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; fill: #b8361e; }
    </style>
  </defs>
  <rect width="1200" height="630" fill="#fbf8f1"/>
  <rect x="0" y="0" width="1200" height="8" fill="#b8361e"/>

  <!-- Compass mark -->
  <g transform="translate(140 175) scale(2.8)" fill="none">
    <circle cx="50" cy="50" r="44" stroke="#1F1A14" stroke-width="0.9"/>
    <circle cx="50" cy="50" r="33" stroke="#1F1A14" stroke-width="0.6" stroke-opacity="0.45"/>
    <g stroke="#1F1A14" stroke-linecap="round">
      <g stroke-width="1.1">
        <line x1="50" y1="6" x2="50" y2="13" transform="rotate(90 50 50)"/>
        <line x1="50" y1="6" x2="50" y2="13" transform="rotate(180 50 50)"/>
        <line x1="50" y1="6" x2="50" y2="13" transform="rotate(270 50 50)"/>
      </g>
      <g stroke-width="0.7" stroke-opacity="0.5">
        <line x1="50" y1="6" x2="50" y2="10" transform="rotate(30 50 50)"/>
        <line x1="50" y1="6" x2="50" y2="10" transform="rotate(60 50 50)"/>
        <line x1="50" y1="6" x2="50" y2="10" transform="rotate(120 50 50)"/>
        <line x1="50" y1="6" x2="50" y2="10" transform="rotate(150 50 50)"/>
        <line x1="50" y1="6" x2="50" y2="10" transform="rotate(210 50 50)"/>
        <line x1="50" y1="6" x2="50" y2="10" transform="rotate(240 50 50)"/>
        <line x1="50" y1="6" x2="50" y2="10" transform="rotate(300 50 50)"/>
        <line x1="50" y1="6" x2="50" y2="10" transform="rotate(330 50 50)"/>
      </g>
    </g>
    <polygon points="46,8 54,8 50,16" fill="#1F1A14"/>
    <polygon points="33,79.44 55.2,53 44.8,47" stroke="#1F1A14" stroke-width="0.9" stroke-linejoin="round"/>
    <polygon points="67,20.56 55.2,53 44.8,47" fill="#B8361E"/>
    <circle cx="50" cy="50" r="3" fill="#FBF8F1" stroke="#1F1A14" stroke-width="0.9"/>
  </g>

  <!-- Wordmark + tagline -->
  <text x="470" y="285" class="kick">HSPA Monitor</text>
  <text x="468" y="370" class="brand" font-size="76">Zdravé <tspan font-style="italic" font-weight="400">Česko</tspan></text>
  <text x="470" y="430" class="tag">Hodnocení výkonnosti zdravotního systému ČR</text>
  <text x="470" y="462" class="tag">podle metodiky OECD HSPA — 80 indikátorů, kraje, trend.</text>
  <text x="470" y="540" class="tag" font-size="18" fill="#8a8175">hspa-cesko.cz · skorezdravotnictvi.cz</text>
</svg>
