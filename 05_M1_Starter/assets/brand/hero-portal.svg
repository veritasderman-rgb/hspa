<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="Inter, sans-serif">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&amp;display=swap');
      .serif { font-family: 'Source Serif 4', Georgia, 'Times New Roman', serif; }
      .sans  { font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif; }
    </style>
  </defs>

  <!-- pozadí -->
  <rect width="1200" height="630" fill="#fbf8f1"/>

  <!-- pravý akcentový pruh -->
  <rect x="1188" y="0" width="12" height="630" fill="#b8361e"/>

  <!-- záhlaví: kicker + doména -->
  <text class="sans" x="80" y="60" font-size="17" font-weight="700" letter-spacing="3" fill="#b8361e">ZDRAVÉ ČESKO · HSPA MONITOR</text>
  <text class="sans" x="1120" y="60" font-size="14" font-weight="500" letter-spacing="0.4" fill="#5f574e" text-anchor="end">skorezdravotnictvi.cz</text>

  <!-- horní vlasová linka -->
  <line x1="80" y1="84" x2="1120" y2="84" stroke="#1f1a14" stroke-opacity="0.16" stroke-width="1.5"/>

  <!-- svislý předěl mezi obsahem a rámcem -->
  <line x1="672" y1="116" x2="672" y2="556" stroke="#1f1a14" stroke-opacity="0.1" stroke-width="1.5"/>

  <!-- headline -->
  <text class="serif" x="80" y="208" font-size="76" font-weight="700" letter-spacing="-1" fill="#1f1a14">Skóre českého</text>
  <text class="serif" x="80" y="294" font-size="76" font-weight="700" letter-spacing="-1" fill="#1f1a14">zdravotnictví.</text>
  <rect x="82" y="310" width="470" height="8" fill="#b8361e"/>

  <!-- deck -->
  <text class="sans" x="80" y="374" font-size="21" font-weight="400" fill="#5f574e">Nezávislý datový portál hodnotící výkonnost</text>
  <text class="sans" x="80" y="404" font-size="21" font-weight="400" fill="#5f574e">zdravotního systému ČR podle metodiky OECD HSPA.</text>

  <!-- spodní metadata -->
  <line x1="80" y1="470" x2="612" y2="470" stroke="#1f1a14" stroke-opacity="0.16" stroke-width="1.5"/>
  <text class="sans" x="80" y="508" font-size="13.5" font-weight="600" letter-spacing="1" fill="#1f1a14">86 INDIKÁTORŮ&#8195;·&#8195;4 OBLASTI HSPA&#8195;·&#8195;14 KRAJŮ</text>
  <text class="sans" x="80" y="534" font-size="13.5" font-weight="400" fill="#5f574e">Data: ÚZIS · ČSÚ · OECD · Eurostat · aktualizováno denně</text>

  <!-- wordmark -->
  <rect x="80" y="567" width="9" height="9" fill="#b8361e"/>
  <text class="serif" x="100" y="583" font-size="25" fill="#1f1a14"><tspan font-weight="700">HSPA</tspan><tspan font-style="italic" font-weight="400"> Monitor</tspan></text>

  <!-- ===== pravý panel: rámec hodnocení ===== -->
  <text class="sans" x="712" y="128" font-size="12.5" font-weight="700" letter-spacing="2" fill="#5f574e">ČTYŘI OBLASTI HODNOCENÍ</text>

  <!-- 01 Výsledky -->
  <rect x="712" y="146" width="206" height="190" rx="12" fill="#f3eee2"/>
  <text class="sans"  x="734" y="190" font-size="14" font-weight="700" letter-spacing="1" fill="#b8361e">01</text>
  <rect x="734" y="200" width="26" height="4" fill="#b8361e"/>
  <text class="serif" x="734" y="246" font-size="26" font-weight="700" fill="#1f1a14">Výsledky</text>
  <text class="sans"  x="734" y="278" font-size="12.5" font-weight="400" fill="#5f574e">Zdravotní stav a délka</text>
  <text class="sans"  x="734" y="296" font-size="12.5" font-weight="400" fill="#5f574e">života obyvatel ČR</text>

  <!-- 02 Výstupy -->
  <rect x="934" y="146" width="206" height="190" rx="12" fill="#f3eee2"/>
  <text class="sans"  x="956" y="190" font-size="14" font-weight="700" letter-spacing="1" fill="#2c5a8a">02</text>
  <rect x="956" y="200" width="26" height="4" fill="#2c5a8a"/>
  <text class="serif" x="956" y="246" font-size="26" font-weight="700" fill="#1f1a14">Výstupy</text>
  <text class="sans"  x="956" y="278" font-size="12.5" font-weight="400" fill="#5f574e">Kvalita, bezpečnost</text>
  <text class="sans"  x="956" y="296" font-size="12.5" font-weight="400" fill="#5f574e">a dostupnost péče</text>

  <!-- 03 Procesy -->
  <rect x="712" y="352" width="206" height="190" rx="12" fill="#f3eee2"/>
  <text class="sans"  x="734" y="396" font-size="14" font-weight="700" letter-spacing="1" fill="#a05a08">03</text>
  <rect x="734" y="406" width="26" height="4" fill="#a05a08"/>
  <text class="serif" x="734" y="452" font-size="26" font-weight="700" fill="#1f1a14">Procesy</text>
  <text class="sans"  x="734" y="484" font-size="12.5" font-weight="400" fill="#5f574e">Jak systém léčí</text>
  <text class="sans"  x="734" y="502" font-size="12.5" font-weight="400" fill="#5f574e">a předchází nemocem</text>

  <!-- 04 Struktury -->
  <rect x="934" y="352" width="206" height="190" rx="12" fill="#f3eee2"/>
  <text class="sans"  x="956" y="396" font-size="14" font-weight="700" letter-spacing="1" fill="#2f6d4f">04</text>
  <rect x="956" y="406" width="26" height="4" fill="#2f6d4f"/>
  <text class="serif" x="956" y="452" font-size="26" font-weight="700" fill="#1f1a14">Struktury</text>
  <text class="sans"  x="956" y="484" font-size="12.5" font-weight="400" fill="#5f574e">Lidé, lůžka, technika</text>
  <text class="sans"  x="956" y="502" font-size="12.5" font-weight="400" fill="#5f574e">a peníze v systému</text>
</svg>
