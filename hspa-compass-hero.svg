<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="180" height="180" fill="none" role="img" aria-label="HSPA kompas">
  <!-- dial: outer + inner ring -->
  <circle cx="50" cy="50" r="44" stroke="#1F1A14" stroke-width="0.9"/>
  <circle cx="50" cy="50" r="33" stroke="#1F1A14" stroke-width="0.6" stroke-opacity="0.45"/>
  <!-- measurement scale -->
  <g stroke="#1F1A14" stroke-linecap="round">
    <!-- major ticks E / S / W -->
    <g stroke-width="1.1">
      <line x1="50" y1="6" x2="50" y2="13" transform="rotate(90 50 50)"/>
      <line x1="50" y1="6" x2="50" y2="13" transform="rotate(180 50 50)"/>
      <line x1="50" y1="6" x2="50" y2="13" transform="rotate(270 50 50)"/>
    </g>
    <!-- minor ticks every 30 degrees -->
    <g stroke-width="0.7" stroke-opacity="0.5">
      <line x1="50" y1="6" x2="50" y2="10" transform="rotate(30 50 50)"/>
      <line x1="50" y1="6" x2="50" y2="10" transform="rotate(60 50 50)"/>
      <line x1="50" y1="6" x2="50" y2="10" transform="rotate(120 50 50)"/>
      <line x1="50" y1="6" x2="50" y2="10" transform="rotate(150 50 50)"/>
      <line x1="50" y1="6" x2="50" y2="10" transform="rotate(210 50 50)"/>
      <line x1="50" y1="6" x2="50" y2="10" transform="rotate(240 50 50)"/>
      <line x1="50" y1="6" x2="50" y2="10" transform="rotate(300 50 50)"/>
      <line x1="50" y1="6" x2="50" y2="10" transform="rotate(330 50 50)"/>
    </g>
  </g>
  <!-- "true north" benchmark index -->
  <polygon points="46,8 54,8 50,16" fill="#1F1A14"/>
  <!-- needle: back half (outline) -->
  <polygon points="33,79.44 55.2,53 44.8,47" stroke="#1F1A14" stroke-width="0.9" stroke-linejoin="round"/>
  <!-- needle: front half (heading) -->
  <polygon points="67,20.56 55.2,53 44.8,47" fill="#1F1A14"/>
  <!-- pivot hub -->
  <circle cx="50" cy="50" r="3" fill="#FBF8F1" stroke="#1F1A14" stroke-width="0.9"/>
</svg>
