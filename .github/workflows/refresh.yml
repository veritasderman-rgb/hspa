name: Refresh data

# Spouští se v pondělí 06:00 UTC. Provede ingest pipeline,
# validuje výsledek a commitne změny v data/ (+ nový snapshot)
# zpět do repa. Vercel se po pushi sám rebuildne.
#
# PROČ TÝDNĚ, NE DENNĚ (změna 2026-07-29):
# Zdroje (OECD, Eurostat, ČSÚ, ÚZIS) publikují ročně až čtvrtletně, ne denně.
# Měření na 71 snapshotech (2026-05-05 → 07-29): medián 1 změna hodnoty za den
# — a i ta je většinou nově přidaný indikátor nebo redakční oprava, ne nová
# vlna ze zdroje. Rok dat se posunul jen u 26 % indikátorů za celé tři měsíce.
# Denní běh naopak generoval šum: 2026-07-27 nula změn hodnot, ale pět flipů
# origin live→seed při výpadku zdroje (viz PR #893 — OECD Accept-Language).
# Týdenní kadence drží zpoždění za novou vlnou pod 7 dny, sedmkrát sníží počet
# běhů i flipů a zpomalí přírůstek snapshotů v repu. Pro cílený doběh při
# známé publikaci je tu workflow_dispatch.
#
# Po ingestu spustí verify:freshness, který fail-uje pokud
# poměr indikátorů s `origin: live` klesne pod MIN_LIVE_RATIO.
# Bez toho by tichý fallback na seed maskoval rozbité fetchery.

on:
  schedule:
    - cron: '0 6 * * 1'   # pondělí 06:00 UTC
  workflow_dispatch:  # ruční doběh, když zdroj vydá novou vlnu mimo pondělí

permissions:
  contents: write  # potřeba pro commit do data/
  issues: write    # potřeba pro automatické otevření issue při selhání

env:
  # Práh pro verify:freshness — pokud méně indikátorů než tento podíl
  # má origin=live, workflow failne a data se NEpushne.
  # 59 z 11 fetcherů živě funguje (live_ratio ~0.364), takže gate je
  # zapnutý na 0.3: zachytí regresi, kdy se část fetcherů rozbije a data
  # tiše spadnou zpět na seed, ale nechá projít běžný stav.
  # Cíl po dalších opravách fetcherů (PLAN-VERIFIKACE-INDIKATORU.md): 0.5–0.8.
  MIN_LIVE_RATIO: '0.3'

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: 05_M1_Starter
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 05_M1_Starter/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ingest pipeline
        id: ingest
        run: |
          set -o pipefail
          npm run ingest 2>&1 | tee /tmp/ingest.log

      - name: Refresh emergency services (pohotovosti)
        # Vlastní pipeline mimo `npm run ingest`: tahá ze seznamu VZP
        # (~300 stránek s pauzou mezi požadavky), z NRPZS a ze čtyř krajských
        # otevřených dat. Trvá kolem deseti minut, proto má job timeout 35 min.
        #
        # continue-on-error ZÁMĚRNĚ: zdrojem hodin je scrapované HTML VZP.
        # Když jim spadne web nebo změní šablonu, nesmí to zablokovat refresh
        # všech ostatních dat. Fetcher v takovém případě skončí chybou (má
        # prahovou kontrolu MIN_EXPECTED), v repu zůstane poslední platná
        # verze a `validate:all` níž ověří, že je pořád v pořádku. Datum
        # poslední aktualizace stránka čtenáři ukazuje, takže zastaralost
        # není neviditelná.
        continue-on-error: true
        # Před transformem běží drift-check ručně ověřených hodin denních
        # ambulancí (citáty vs. živé weby nemocnic) — výsledek se propíše do
        # data/pohotovosti.json jako `hours_check` a stránka umí říct „zdroj
        # se od ověření změnil“. `|| true`: drift je redakční úkol, ne důvod
        # zastavit refresh; nedostupný web nemocnice tím spíš.
        run: |
          npm run verify:ambulance-drift || true
          npm run data:pohotovosti
          # Okresní landing pages se přepisují jen při skutečné změně obsahu
          # (builder porovnává), takže commit nebobtná o nezměněné soubory.
          npm run build:pohotovosti-okresy

      - name: Rebuild PPO web data
        # Karty „Ve Věstníku MZ" na detailech skupin (mergeVestnik) se plní
        # z čerstvého data/vestniky.json až při build:ppo — bez tohoto kroku
        # by nové částky dorazily do archivu a indikátorů, ale karty orgánů
        # by zůstaly stát. Commit kroku níže bere celý data/ adresář.
        run: npm run build:ppo

      - name: Build generated artifacts
        # Znalostní graf indikátorů (BAR6) slije čerstvé indicators.json
        # s kurátorovanými datasety (system-model, legislativa, articles,
        # claims, barometr) do data/souvislosti.json pro blok „Souvislosti".
        # Pouštíme rovnou build:generated, protože čerstvá indicators.json
        # mění i diagnoza-index (křížové vazby).
        #
        # Regeneraci nelze nechat na regenerate-artifacts.yml — ten běží na
        # `push` do main, jenže tenhle job pushuje s výchozím GITHUB_TOKEN
        # a GitHub pro takové pushe další workflow běhy potlačuje.
        run: npm run build:generated

      - name: Generate RSS feed
        run: npm run generate:feed

      - name: Generate indicator pages
        run: npm run seo:indicators

      - name: Prerender homepage article list
        run: npm run prerender:home

      - name: Generate sitemap
        run: npm run generate:sitemap

      - name: Validate data (all datasets)
        id: validate
        # Data-integritní brána cronu: validuje ČERSTVĚ zaingestovaná data
        # napříč všemi datasety (indikátory, strategie, explainery, prevence,
        # články, claims-quotes, …). Nahrazuje dřívější plný `npm test`, který
        # nad re-ingestovanými, síťově proměnlivými daty padal na editorialních
        # konzistenčních testech (verification-origin-consistency) i bez reálné
        # chyby — kód se v cronu nemění (běží nad commitnutým mainem), takže
        # unit-testy tu regresi zachytit nemohou, jen šum. Plnou testovou sadu
        # nad COMMITNUTÝMI daty hlídá deploy-check.yml na každém PR. (issue #681)
        run: |
          set -o pipefail
          npm run validate:all 2>&1 | tee /tmp/validate.log

      - name: Verify data freshness
        id: freshness
        run: |
          set -o pipefail
          # Vždy vygeneruj report, gating zařídí --min-live-ratio.
          npm run verify:freshness -- --min-live-ratio=${MIN_LIVE_RATIO} 2>&1 | tee /tmp/freshness.txt
          {
            echo 'report<<EOF'
            cat /tmp/freshness.txt
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Diagnostics on failure
        if: failure()
        run: |
          echo "::group::Last 80 lines of ingest log"
          tail -n 80 /tmp/ingest.log 2>/dev/null || echo "no ingest log"
          echo "::endgroup::"
          echo "::group::Last 80 lines of validate log"
          tail -n 80 /tmp/validate.log 2>/dev/null || echo "no validate log"
          echo "::endgroup::"
          echo "::group::Last 80 lines of freshness log"
          tail -n 80 /tmp/freshness.txt 2>/dev/null || echo "no freshness log"
          echo "::endgroup::"

      - name: Commit refreshed data (if changed)
        if: success()
        working-directory: ${{ github.workspace }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 05_M1_Starter/data/ 05_M1_Starter/feed.xml 05_M1_Starter/sitemap.xml 05_M1_Starter/index.html
          # styles.min.css leží mimo data/ — bez tohohle by ho build:generated
          # přegeneroval, ale commit by ho minul.
          git add 05_M1_Starter/src/styles.min.css
          # -A + quoted pathspec: git (ne shell) expanduje glob, takže se
          # zastageují i SMAZANÉ indikátorové stránky (odstraněný/přejmenovaný
          # indikátor) — jinak by stará stránka zůstala v repu i na webu.
          git add -A -- '05_M1_Starter/indikator-*.html'
          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi
          git commit -m "data: refresh $(date -u +%Y-%m-%d)"

          # Push s retry + rebase při race condition: pokud mezi
          # checkoutem a pushem došel do main jiný commit (běžné, když
          # cron běží paralelně s mergem PR), zkus rebasenout na nejnovější
          # origin/main a push opakuj. Max 5 pokusů.
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "Push succeeded on attempt $attempt."
              exit 0
            fi
            echo "Push attempt $attempt failed (likely race with concurrent push). Rebasing on origin/main..."
            git fetch origin main
            if ! git rebase origin/main; then
              echo "Rebase has conflicts — aborting and giving up."
              git rebase --abort || true
              exit 1
            fi
            # Krátká pauza, kdyby konkurenční push běžel ještě
            sleep $((attempt * 2))
          done
          echo "Push failed after 5 attempts."
          exit 1

      - name: Open or update freshness alert issue on failure
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const title = '🚨 Data refresh failure — cron refresh.yml selhal';
            const body = [
              '**Automatický cron `refresh.yml` selhal.** Data NEbyla pushnuta do `main`.',
              '',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `Datum: ${new Date().toISOString()}`,
              '',
              'Brána cronu = `validate:all` (integrita čerstvých dat) + `verify:freshness`',
              '(poměr `origin: live` ≥ `MIN_LIVE_RATIO`). Selhal jeden z nich.',
              '',
              '## Co s tím',
              '1. Otevřít run log, sekce „Diagnostics on failure" — rozliš, zda spadl',
              '   `validate` (nevalidní dataset) nebo `freshness` (moc fetcherů na seed).',
              '2. **freshness**: zjistit, který fetcher tiše spadl na seed (souhrn fetcherů',
              '   v ingest logu); u 404/400 ověřit URL/dimenze v `PLAN_AUTOMATICKY_INGEST.md`.',
              '3. **validate**: oprav dataset dle výpisu validátoru.',
              '4. Po opravě spustit `workflow_dispatch` pro re-run.',
              '',
              '_Issue je automaticky aktualizován při dalším selhání._'
            ].join('\n');

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'freshness-alert',
            });

            if (issues.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues[0].number,
                body: `Další selhání: ${new Date().toISOString()} · run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['freshness-alert', 'bug'],
              });
            }
