name: Visual + a11y regression

# Doplněk k visual-a11y.yml pro povinné checky větve main — stejný princip
# jako deploy-check-skip.yml: visual-a11y.yml běží jen na PR měnící
# 05_M1_Starter/, a povinný check by u ostatních PR zůstal „Expected"
# navždy. Tenhle workflow se stejným jménem a jobem `e2e` se spouští na
# doplňkové cesty a hlásí úspěch: frontend se nezměnil, snapshoty ani axe
# nemají co porovnávat.

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '05_M1_Starter/**'

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: echo "PR frontend (05_M1_Starter/) nemění — vizuální a a11y regrese není potřeba."
