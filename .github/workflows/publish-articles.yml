name: Publish scheduled articles

# Spouští se každý den v 04:00 UTC (= 06:00 CEST / 05:00 CET v zimě).
# Vybere a publikuje NEJVÝŠE JEDEN článek z fronty data/articles.json —
# nejaktuálnější (nejbližší topical_until), jinak nejdéle připravený
# (nejstarší ready_since). scheduled_for funguje jako „ne dřív než".
# Pokud něco změnil, commitne změnu zpět do main → Vercel se rebuildne.
# Detaily výběrového pravidla viz scripts/publish-scheduled.js.

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:  # umožní manuální spuštění z GitHub UI

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: 05_M1_Starter
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 05_M1_Starter/package-lock.json

      # Nutné pro generování náhledové grafiky publikovaného článku
      # (scripts/publish-scheduled.js → @resvg/resvg-js přes generate-article-cover.js).
      - name: Kill switch AI provozu
        # GOVERNANCE.md § 5: při stavu „pozastaveno" v data/ai-provoz.json skončí
        # job tady kódem 1 — dřív než cokoli nainstaluje, pošle nebo commitne.
        # Přepíná workflow ai-provoz.yml.
        #
        # Stav se čte VŽDY z main, ne z checkoutu: ruční spuštění (Run workflow)
        # dovolí vybrat jinou větev a ta může nést „bezi", i když je main
        # pozastavený. Když fetch nebo čtení selže, krok spadne = bezpečná strana.
        run: |
          git fetch --no-tags --depth=1 origin main
          git show origin/main:05_M1_Starter/data/ai-provoz.json > "$RUNNER_TEMP/ai-provoz.json"
          AI_PROVOZ_STATE="$RUNNER_TEMP/ai-provoz.json" node scripts/ai-provoz.js check

      - name: Install dependencies
        run: npm ci

      - name: Run publish-scheduled
        run: node scripts/publish-scheduled.js | tee /tmp/publish-out.txt

      - name: Regenerate RSS feed
        run: npm run generate:feed

      - name: Prerender homepage article list
        run: npm run prerender:home

      - name: Regenerate sitemap
        run: npm run generate:sitemap

      - name: Regenerate generated artifacts
        # VŠECHNY čtyři, ne jen search-index: publikace článku mění i
        # diagnoza-index (křížové vazby) a souvislosti (znalostní graf).
        #
        # Regeneraci nelze nechat na regenerate-artifacts.yml — ten se spouští
        # na `push` do main, jenže tenhle job pushuje s výchozím GITHUB_TOKEN
        # a GitHub pro takové pushe další workflow běhy záměrně potlačuje.
        # Kdyby se na něj spoléhalo, zůstaly by po každé denní publikaci dva
        # indexy zastaralé.
        run: npm run build:generated

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit + push if changes
        run: |
          if git diff --quiet data/articles.json; then
            echo "No changes to articles.json — nothing to commit."
            exit 0
          fi
          git add feed.xml sitemap.xml
          git add data/search-index.json data/diagnoza-index.json data/souvislosti.json src/styles.min.css
          # Extract published list for commit message
          PUBLISHED=$(grep -E '^  - ' /tmp/publish-out.txt || echo "")
          DATE=$(date -u +%Y-%m-%d)
          # articles.json (vždy) + vygenerovaná náhledová grafika + HTML s injektovaným
          # coverem (mění se jen při skutečné publikaci článku).
          git add data/articles.json assets/covers
          git add ./*.html
          git commit -m "chore(publish): zveřejněno $DATE

          $PUBLISHED

          Auto-publikováno cronem .github/workflows/publish-articles.yml" || exit 0
          git push origin HEAD:main
