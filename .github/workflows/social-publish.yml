name: Social · publikace schválených

# Týdně v pondělí 07:00 CEST (= 05:00 UTC). Přečte z Notion fronty
# schválené příspěvky, vloží je přímo do Buffer fronty (per kanál) a na závěr
# vypíše týdenní souhrn do shrnutí běhu.

on:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: 05_M1_Starter
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalace závislostí
        run: npm ci

      - name: Publikovat schválené příspěvky
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
          BUFFER_PROFILE_FACEBOOK: ${{ secrets.BUFFER_PROFILE_FACEBOOK }}
          BUFFER_PROFILE_INSTAGRAM: ${{ secrets.BUFFER_PROFILE_INSTAGRAM }}
          BUFFER_PROFILE_LINKEDIN: ${{ secrets.BUFFER_PROFILE_LINKEDIN }}
          BUFFER_PROFILE_X: ${{ secrets.BUFFER_PROFILE_X }}
        run: node social/run-publish.js

      - name: Týdenní souhrn
        if: always()
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: node social/reporting/weekly-report.js >> "$GITHUB_STEP_SUMMARY"
