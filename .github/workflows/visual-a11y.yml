name: Visual + a11y regression

# Spouští Playwright visual snapshots + axe-core a11y scan napříč 3 viewporty.
# Failuje pokud:
#  - vizuální regrese > 1 % pixelů (toHaveScreenshot maxDiffPixelRatio)
#  - nová critical/serious axe violation
#
# AKTIVNÍ: baseline snapshots (tests/e2e/visual.spec.js-snapshots/) a devDeps
# (@playwright/test, @axe-core/playwright, playwright) jsou commitnuté, takže
# workflow běží automaticky na každý PR měnící frontend.
#
# DŮLEŽITÉ — baseline MUSÍ vzniknout v CI prostředí:
#   Playwright fullPage snapshoty jsou citlivé na font rendering, který se mezi
#   prostředími (lokální kontejner vs. GitHub ubuntu runner) liší i o stovky
#   pixelů na výšku dlouhých stránek. Baseline vygenerovaný lokálně proto v CI
#   NEPROJDE. Po vědomé vizuální změně přegeneruj baseline přímo v CI:
#     Actions → "Visual + a11y regression" → Run workflow → update_baseline: true
#   Job snapshoty vygeneruje na runneru a commitne je do zvolené větve.

on:
  workflow_dispatch:
    inputs:
      update_baseline:
        description: 'Přegenerovat visual baseline na runneru a commitnout'
        type: boolean
        default: false
  pull_request:
    branches: [main]

# Job `e2e` je povinný check větve main (ruleset, docs/github-ruleset-main.json),
# proto workflow nemá filtr `paths` — viz vysvětlení v deploy-check.yml. Job
# `zmeny` zjistí dotčené cesty a `e2e` se přeskočí, když PR frontend nemění;
# přeskočený job se u povinných checků počítá jako splněný. Ruční spuštění
# (workflow_dispatch) běží vždy.

jobs:
  zmeny:
    name: Dotčené cesty (visual + a11y)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      frontend: ${{ steps.filtr.outputs.frontend }}
    steps:
      - name: Dotýká se PR frontendu?
        id: filtr
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            echo "Ruční spuštění — testy poběží."
            exit 0
          fi
          FILES=$(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename')
          if printf '%s\n' "$FILES" | grep -qE '^(05_M1_Starter/|\.github/workflows/visual-a11y\.yml$)'; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            echo "PR mění frontend — vizuální a a11y regrese poběží."
          else
            echo "frontend=false" >> "$GITHUB_OUTPUT"
            echo "PR frontend (05_M1_Starter/) nemění — vizuální a a11y regrese se přeskočí."
          fi

  e2e:
    needs: zmeny
    if: needs.zmeny.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    defaults:
      run:
        working-directory: 05_M1_Starter

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 05_M1_Starter/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build generated artifacts
        # E2E servíruje repo tak, jak leží. Obsahové PR generované artefakty
        # necommitují (viz regenerate-artifacts.yml), takže styles.min.css
        # a indexy je potřeba dogenerovat tady — jinak by vizuální snímky
        # běžely nad starým CSS.
        run: npm run build:generated

      # Ruční režim: přegeneruj baseline na runneru a commitni ho. Snapshoty
      # vzniklé v tomto prostředí jsou jediné, které pak v CI projdou.
      - name: Update baseline (manual)
        if: github.event_name == 'workflow_dispatch' && inputs.update_baseline
        run: npx playwright test tests/e2e/visual.spec.js --config=playwright.config.js --update-snapshots
        env:
          CI: 'true'

      - name: Commit updated baseline
        if: github.event_name == 'workflow_dispatch' && inputs.update_baseline
        run: |
          if git diff --quiet tests/e2e/visual.spec.js-snapshots; then
            echo "Baseline beze změny — nic ke commitu."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/visual.spec.js-snapshots
          git commit -m "test(e2e): přegenerování visual baseline na CI runneru [skip ci]"
          git push origin HEAD:${GITHUB_REF_NAME}

      # Normální režim (PR i ruční bez update): spusť testy proti baselinu.
      - name: Run visual + a11y tests
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.update_baseline) }}
        run: npx playwright test --config=playwright.config.js
        env:
          CI: 'true'

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: 05_M1_Starter/playwright-report/
          retention-days: 14
