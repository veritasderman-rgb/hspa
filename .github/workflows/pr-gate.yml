name: Brána PR

# Vydavatelská brána (GOVERNANCE.md § 3): každý PR mechanicky zařadí do třídy
# A · auto / B · editor / C · člověk podle dotčených cest
# (05_M1_Starter/scripts/pr-gate.js) a výsledek zapíše jako label
# brana-auto / brana-editor / brana-clovek + tabulku do shrnutí běhu.
#
# Třída A: brána zapne auto-merge GitHubu (krok „Auto-merge třídy A“) a PR
# se zmerguje sám, jakmile projdou povinné checky rulesetu větve main
# (check, e2e, Brána PR). Třídu B merguje editor (PROMPT_EDITOR.md), třídu C
# vydavatel. Job je povinný check větve main — když brána spadne, PR nejde
# zmergovat.
#
# Label se nastavuje s continue-on-error: PR z forku má token jen pro čtení,
# tam zůstane výsledek aspoň ve shrnutí běhu a PR bez labelu editor podle
# PROMPT_EDITOR.md § 0 nemerguje (= bezpečná strana).

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: pr-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  brana:
    name: Brána PR
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: 05_M1_Starter
    steps:
      - uses: actions/checkout@v5
        with:
          # Celá historie: brána porovnává merge commit PR proti základní větvi.
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Zařadit PR do třídy
        id: trida
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags origin "$BASE_REF"
          node scripts/pr-gate.js --base "origin/$BASE_REF" --head HEAD --markdown >> "$GITHUB_STEP_SUMMARY"
          LABEL=$(node scripts/pr-gate.js --base "origin/$BASE_REF" --head HEAD --label-only | tail -n 1)
          case "$LABEL" in
            brana-auto|brana-editor|brana-clovek) ;;
            *) echo "::error::Brána nevrátila platný label: '$LABEL'"; exit 1 ;;
          esac
          echo "Třída PR → label $LABEL"
          echo "label=$LABEL" >> "$GITHUB_OUTPUT"

      - name: Nastavit label brány
        # PR z forku: token bez práva zápisu → krok selže, ale brána ne.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          LABEL: ${{ steps.trida.outputs.label }}
        run: |
          gh label create brana-auto   --repo "$REPO" --force --color 0E8A16 --description "Brána: třída A — merge po zelené CI (editor, bez obsahové revize)"
          gh label create brana-editor --repo "$REPO" --force --color 1D76DB --description "Brána: třída B — adversariální revize nezávislým editorem, pak merge"
          gh label create brana-clovek --repo "$REPO" --force --color B60205 --description "Brána: třída C — merguje jen vydavatel (GOVERNANCE.md § 3)"
          REMOVE=""
          for L in brana-auto brana-editor brana-clovek; do
            [ "$L" = "$LABEL" ] || REMOVE="$REMOVE --remove-label $L"
          done
          # shellcheck disable=SC2086
          gh pr edit "$PR" --repo "$REPO" --add-label "$LABEL" $REMOVE

      - name: Auto-merge třídy A
        # GOVERNANCE.md § 3: o třídě A rozhoduje CI. Krok zapne auto-merge GitHubu;
        # samotný merge udělá GitHub až po zelených povinných checkách rulesetu
        # (docs/github-ruleset-main.json). Brána tím nic neobchází — bez rulesetu
        # s povinnými checky by `gh pr merge --auto` zmergoval PR okamžitě, ještě
        # před doběhnutím testů, proto krok napřed ověří, že ruleset všechny tři
        # checky vyžaduje, a jinak auto-merge nezapne.
        #
        # Kill switch (GOVERNANCE.md § 5): při stavu „pozastaveno" se auto-merge
        # nezapíná a už zapnutý se vypne — tenhle krok publikuje, ne jen validuje.
        # Stav se čte vždy z main, ne z checkoutu, stejně jako v cronech. Pauza
        # zapnutá až po tomhle kroku (v okně do doběhnutí CI) je pokrytá z druhé
        # strany: ai-provoz.yml při pozastavení vypne auto-merge na všech
        # otevřených PR.
        #
        # Token: secret AUTOMERGE_TOKEN = fine-grained PAT vydavatele jen pro tohle
        # repo (Contents: write, Pull requests: write). GITHUB_TOKEN použít nejde:
        # merge provedený jeho jménem nespustí regenerate-artifacts.yml (push od
        # GITHUB_TOKEN nevyvolá workflow) a web by se nenasadil — Vercel build
        # obsahového merge přeskakuje a čeká na commit bota. GITHUB_TOKEN slouží
        # jen ke čtení (stav auto-merge, pravidla větve).
        #
        # Když token chybí, ruleset není importovaný nebo PR přišel z forku (secret
        # není k dispozici), krok to jen zapíše do shrnutí a PR třídy A zmerguje
        # editor jako dřív (PROMPT_EDITOR.md § 2). Když PR po dalším pushi z třídy A
        # vypadne (label B/C) nebo je provoz pozastaven, už zapnutý auto-merge se
        # VYPNE A VYPNUTÍ SE OVĚŘÍ — když se to nepovede, krok spadne a brána
        # (povinný check) PR zablokuje. Push autora s právem zápisu totiž auto-merge
        # sám nevypíná, a bez ověření by se B/C změny zmergovaly bez revize.
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          AUTOMERGE_TOKEN: ${{ secrets.AUTOMERGE_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          LABEL: ${{ steps.trida.outputs.label }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          shrnuti() { echo "$1" >> "$GITHUB_STEP_SUMMARY"; echo "$1"; }
          zapnuto() { gh api "repos/$REPO/pulls/$PR" --jq '.auto_merge != null'; }

          # Uz zapnuty auto-merge? (cteni staci GITHUB_TOKEN)
          ARMED=$(zapnuto)

          # Kill switch - stav vzdy z main. Chyba cteni = krok spadne = bezpecna strana.
          git fetch --no-tags --depth=1 origin main
          git show origin/main:05_M1_Starter/data/ai-provoz.json > "$RUNNER_TEMP/ai-provoz.json"
          BEZI=0
          if AI_PROVOZ_STATE="$RUNNER_TEMP/ai-provoz.json" node scripts/ai-provoz.js check; then BEZI=1; fi

          CHTIT=0
          if [ "$LABEL" = "brana-auto" ] && [ "$BEZI" = 1 ]; then CHTIT=1; fi

          if [ "$CHTIT" = 0 ]; then
            if [ "$ARMED" = true ]; then
              if [ -z "$AUTOMERGE_TOKEN" ]; then
                echo "::error::Auto-merge je zapnuty, ale PR uz neni trida A nebo je provoz pozastaven, a chybi AUTOMERGE_TOKEN na jeho vypnuti. Brana PR blokuje."
                exit 1
              fi
              GH_TOKEN="$AUTOMERGE_TOKEN" gh pr merge "$PR" --repo "$REPO" --disable-auto || true
              ARMED=$(zapnuto)
              if [ "$ARMED" = true ]; then
                echo "::error::Vypnuti auto-merge se nepodarilo overit (PR uz neni trida A nebo je provoz pozastaven). Brana PR blokuje."
                exit 1
              fi
              shrnuti "Auto-merge vypnut: PR už není třída A, nebo je provoz AI pozastaven."
            fi
            if [ "$BEZI" = 0 ]; then
              shrnuti "Auto-merge: nezapnuto, provoz AI je pozastaven (GOVERNANCE.md § 5, workflow ai-provoz.yml)."
            fi
            exit 0
          fi

          if [ -z "$AUTOMERGE_TOKEN" ]; then
            echo "::notice::Secret AUTOMERGE_TOKEN neni nastaven - trida A ceka na merge editorem."
            shrnuti "Auto-merge: nezapnuto (chybí secret \`AUTOMERGE_TOKEN\`)."
            exit 0
          fi
          RULES=$(gh api "repos/$REPO/rules/branches/$BASE_REF" \
            --jq '[.[] | select(.type == "required_status_checks") | .parameters.required_status_checks[].context]')
          for CHECK in check e2e "Brána PR"; do
            if ! printf '%s' "$RULES" | jq -e --arg c "$CHECK" 'index($c) != null' >/dev/null; then
              echo "::warning::Ruleset vetve $BASE_REF nevyzaduje check '$CHECK' - auto-merge nezapinam (import docs/github-ruleset-main.json)."
              shrnuti "Auto-merge: nezapnuto (ruleset větve \`$BASE_REF\` nevyžaduje povinný check \`$CHECK\`)."
              exit 0
            fi
          done
          if [ "$ARMED" = true ]; then
            shrnuti "Auto-merge už je zapnutý: PR se zmerguje po zelených povinných checkách."
            exit 0
          fi
          # Zapnutí přímo mutací enablePullRequestAutoMerge, ne `gh pr merge --auto`:
          # gh při stavu „mergeable" PR rovnou zmerguje, a token vydavatele má
          # v rulesetu výjimku role admin. Mutace nikdy nemerguje hned — u PR, který
          # už je čistý, skončí chybou a PR zmerguje editor po zelené CI.
          NODE_ID=$(gh api "repos/$REPO/pulls/$PR" --jq '.node_id')
          if GH_TOKEN="$AUTOMERGE_TOKEN" gh api graphql \
              -f query='mutation($id: ID!) { enablePullRequestAutoMerge(input: {pullRequestId: $id, mergeMethod: MERGE}) { pullRequest { autoMergeRequest { enabledAt } } } }' \
              -f id="$NODE_ID" >/dev/null; then
            shrnuti "Auto-merge zapnut: PR se zmerguje sám po zelených povinných checkách (check, e2e, Brána PR)."
          else
            echo "::warning::Zapnuti auto-merge selhalo (token, opravneni nebo API) - PR tridy A zmerguje editor."
            shrnuti "Auto-merge: zapnutí selhalo, PR zmerguje editor po zelené CI."
          fi
