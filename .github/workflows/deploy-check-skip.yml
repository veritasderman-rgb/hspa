name: Deploy check

# Doplněk k deploy-check.yml pro povinné checky větve main.
#
# deploy-check.yml běží jen na PR, které mění 05_M1_Starter/ nebo workflows.
# GitHub ale u PR, kde se workflow kvůli filtru cest nespustí, nechá povinný
# check „Expected" navždy — PR jen s docs/, prompty nebo GOVERNANCE.md by
# nešel zmergovat. Tenhle workflow má stejné jméno a stejný job `check`,
# spouští se na DOPLŇKOVÉ cesty (paths-ignore = paths originálu) a hlásí
# úspěch: dashboardu se PR nedotkl, není co kontrolovat. Doporučený postup
# GitHubu („Handling skipped but required checks").
#
# U PR, který mění obojí (docs + dashboard), běží oba workflows; povinný check
# bere poslední dokončený běh se jménem `check` — tj. skutečný deploy-check,
# který trvá o řád déle než tento.

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '05_M1_Starter/**'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: echo "PR se dashboardu (05_M1_Starter/) ani workflows nedotýká — Deploy check není potřeba."
