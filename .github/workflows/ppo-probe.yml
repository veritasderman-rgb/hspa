name: PPO probe (průzkum portálu poradních orgánů)

# JEDNORÁZOVÝ PRŮZKUM, spouští se jen ručně. Nic necommituje a nesahá na
# datový kontrakt — zjišťuje, co Portál poradních orgánů, pracovních skupin
# a odborných komisí MZd (ppo.mzcr.cz) reálně publikuje, aby šlo odhadnout,
# jestli má smysl stavět plnohodnotný fetcher.
#
# Proč přes Actions: ppo.mzcr.cz je z prostředí agenta nedosažitelný
# (DNS resolvuje, spojení neprojde — issue #1003), zatímco runner na české
# vládní zdroje běžně dosáhne (refresh.yml tahá živá data z ÚZIS, ČSÚ, SÚKL).
#
# Výstup: artifact `ppo-probe` s report.json a staženými HTML stránkami.

on:
  workflow_dispatch:
    inputs:
      ids:
        description: 'ID skupin oddělená čárkou (prázdné = výchozí vzorek)'
        required: false
        default: ''
      scan:
        description: 'Rozsahový sken ID, např. 1-260 (prázdné = přeskočit)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: 05_M1_Starter
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 05_M1_Starter/package-lock.json

      - run: npm ci

      - name: Průzkumný běh
        # Vstupy jdou přes env, NIKOLI přes ${{ }} přímo do skriptu: GitHub
        # dosazuje interpolaci textově před tím, než ji uvidí bash, takže
        # vstup typu `$(…)` by se na runneru spustil jako příkaz.
        env:
          PROBE_IDS: ${{ inputs.ids }}
          PROBE_SCAN: ${{ inputs.scan }}
        run: |
          set -euo pipefail
          # Pojistka v hloubce: pustíme dál jen čísla, čárky a pomlčku.
          if [ -n "${PROBE_IDS}" ] && ! printf '%s' "${PROBE_IDS}" | grep -Eq '^[0-9]+(,[0-9]+)*$'; then
            echo "::error::Neplatné 'ids' — očekáván seznam čísel oddělených čárkou."; exit 2
          fi
          if [ -n "${PROBE_SCAN}" ] && ! printf '%s' "${PROBE_SCAN}" | grep -Eq '^[0-9]+-[0-9]+$'; then
            echo "::error::Neplatný 'scan' — očekáván rozsah tvaru 1-260."; exit 2
          fi
          ARGS=()
          [ -n "${PROBE_IDS}" ]  && ARGS+=(--ids "${PROBE_IDS}")
          [ -n "${PROBE_SCAN}" ] && ARGS+=(--scan "${PROBE_SCAN}")
          node ingest/probe/ppo-probe.js --out probe-out "${ARGS[@]}" 2>&1 | tee probe-out.log
        continue-on-error: true

      - name: Diagnostika dosažitelnosti
        run: |
          set -uo pipefail
          node ingest/probe/ppo-diagnose.js 2>&1 | tee -a probe-out.log
        continue-on-error: true

      - name: Cílený dotaz do archivu
        run: |
          set -uo pipefail
          node ingest/probe/ppo-archive.js --sample 5 2>&1 | tee -a probe-out.log
        continue-on-error: true

      - name: Přilož výstup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ppo-probe
          path: |
            05_M1_Starter/probe-out/
            05_M1_Starter/probe-out.log
          retention-days: 14
          if-no-files-found: warn
