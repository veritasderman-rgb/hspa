name: Přílepky — pozměňovací návrhy mimo předmět zákona

# Denně přečte otevřená data Poslanecké sněmovny, stáhne texty NOVÝCH písemných
# pozměňovacích návrhů a vyhodnotí, které mění zdravotnický zákon mimo původní
# předmět tisku (nebo cizí zákon ve zdravotnickém tisku). Když se nález změní,
# otevře PR s data/prilepky.json a stavem ingest/data/prilepky-stav.json.
#
# Běží v Actions, protože www.psp.cz není z prostředí agenta dosažitelný.
# Deterministické, bez jazykového modelu. Metodika: 05_M1_Starter/PLAN-PRILEPKY.md.
#
# Zátěž Sněmovny: 2 archivy otevřených dat + 2 požadavky na každý NOVÝ
# pozměňovací návrh, nejvýš 1 požadavek za sekundu. Běžný den jednotky až desítky.

on:
  schedule:
    - cron: '23 3 * * *'    # denně 03:23 UTC, před publikační frontou (04:00)
  workflow_dispatch:
    inputs:
      max:
        description: 'Nejvýš kolik nových pozměňovacích návrhů přečíst'
        required: false
        default: '300'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: prilepky
  cancel-in-progress: false

jobs:
  prilepky:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: 05_M1_Starter
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 05_M1_Starter/package-lock.json

      - name: Kill switch AI provozu
        run: |
          git fetch --no-tags --depth=1 origin main
          git show origin/main:05_M1_Starter/data/ai-provoz.json > "$RUNNER_TEMP/ai-provoz.json"
          AI_PROVOZ_STATE="$RUNNER_TEMP/ai-provoz.json" node scripts/ai-provoz.js check

      - run: npm ci

      - name: Odchytávač (nejvýš 1 požadavek/s)
        env:
          PRILEPKY_MAX: ${{ inputs.max }}
        run: |
          set -euo pipefail
          MAX="${PRILEPKY_MAX:-300}"
          if ! printf '%s' "${MAX}" | grep -Eq '^[0-9]+$'; then echo "::error::Neplatné 'max'."; exit 2; fi
          node ingest/fetchers/psp_prilepky.js --max "${MAX}"

      - name: Validace
        run: node ingest/validate-prilepky.js

      - name: Otevřít PR
        uses: peter-evans/create-pull-request@v7
        with:
          branch: chore/prilepky
          base: main
          commit-message: 'data(prilepky): pozměňovací návrhy mimo předmět zákona — nový stav'
          title: 'data(prilepky): pozměňovací návrhy mimo předmět zákona — nový stav'
          add-paths: |
            05_M1_Starter/data/prilepky.json
            05_M1_Starter/ingest/data/prilepky-stav.json
          delete-branch: true
          body: |
            Rutina `prilepky.yml`: nové písemné pozměňovací návrhy z otevřených dat Poslanecké sněmovny, vyhodnocené proti registru zdravotnických zákonů (`ingest/mapping/zdravotnicke-zakony.json`). Bez jazykového modelu; u každého nálezu je doslovná citace z textu návrhu a odkaz na sněmovní dokument.

            - [ ] U nových nálezů otevřít odkaz na psp.cz a ověřit, že citace sedí a že zákon opravdu nebyl v původním návrhu
            - [ ] Zvážit, jestli nález stojí za článek nebo záznam v Legislativním radaru
