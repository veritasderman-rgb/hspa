name: Newsletter · týdenní příprava

# Každý čtvrtek 09:33 CEST (= 07:33 UTC; v zimě 08:33 CET). Vybere 3–4
# dosud neposlané články + indikátor, Florence (Claude) napíše úvod
# a anotace, kampaň se naplánuje v Brevu na pátek 11:00 Europe/Prague.
# Evidence data/newsletter-log.json se commitne zpět do main — do pátku
# 11:00 lze kampaň v Brevu zrušit nebo upravit.
#
# Secrets: ANTHROPIC_API_KEY (existuje — sdílený se social-generate),
#          BREVO_API_KEY (surový xkeysib-… klíč).

on:
  schedule:
    - cron: '33 7 * * 4'
  workflow_dispatch:
    inputs:
      friday:
        description: 'Datum vydání YYYY-MM-DD (páteční fallback rutiny: dnešek). Prázdné = nejbližší budoucí pátek.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  newsletter:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: 05_M1_Starter
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Kill switch AI provozu
        # GOVERNANCE.md § 5: při stavu „pozastaveno" v data/ai-provoz.json skončí
        # job tady kódem 1 — dřív než cokoli nainstaluje, pošle nebo commitne.
        # Přepíná workflow ai-provoz.yml.
        #
        # Stav se čte VŽDY z main, ne z checkoutu: ruční spuštění (Run workflow)
        # dovolí vybrat jinou větev a ta může nést „bezi", i když je main
        # pozastavený. Když fetch nebo čtení selže, krok spadne = bezpečná strana.
        run: |
          git fetch --no-tags --depth=1 origin main
          git show origin/main:05_M1_Starter/data/ai-provoz.json > "$RUNNER_TEMP/ai-provoz.json"
          AI_PROVOZ_STATE="$RUNNER_TEMP/ai-provoz.json" node scripts/ai-provoz.js check

      - name: Instalace závislostí
        run: npm ci

      - name: Připravit a naplánovat vydání
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
        run: node scripts/newsletter-run.js ${{ inputs.friday != '' && format('--friday={0}', inputs.friday) || '' }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit evidence vydání
        run: |
          git add data/newsletter-log.json
          if git diff --cached --quiet; then
            echo "Vydání přeskočeno nebo už naplánováno — nic ke commitu."
            exit 0
          fi
          git commit -m "chore(newsletter): vydání $(date -u +%Y-%m-%d)"
          # Main se mezi checkoutem a pushem mohl pohnout (jiný workflow/merge).
          # Log je idempotenční pojistka — bez něj by další běh vydání zdvojil,
          # proto push opakujeme přes rebase. (Runner má navíc sekundární
          # pojistku: před založením se ptá Breva na existující kampaň.)
          for i in 1 2 3; do
            git push origin HEAD:main && exit 0
            echo "Push selhal (pokus $i/3) — rebase na aktuální main a retry."
            git pull --rebase origin main
          done
          echo "::error::Push logu selhal i po 3 pokusech. Kampaň v Brevu JE naplánovaná — doplňte data/newsletter-log.json ručně, nebo další běh log doplní sám ze sekundární pojistky."
          exit 1
